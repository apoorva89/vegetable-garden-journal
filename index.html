<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Garden Journal</title>
  <meta name="description" content="My personal gardening journal" />
  <meta name="theme-color" content="#3B2F2F" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Garden Journal" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #FDFAF5; font-family: Georgia, serif; }
    #root { min-height: 100vh; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .sync-dot.ok   { background: #7EC8A4; }
    .sync-dot.err  { background: #C1622F; }
    .sync-dot.busy { background: #E8A838; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    const app = initializeApp({ apiKey:"AIzaSyDORb5oCQNOviNv2fqP2nqKmyBdhpvxTEg", projectId:"garden-journal-d2948", authDomain:"garden-journal-d2948.firebaseapp.com" });
    const db = getFirestore(app);
    const col = () => collection(db,"entries");
    window._fb = {
      async load() { const s=await getDocs(query(col(),orderBy("createdAt","desc"))); return s.docs.map(d=>({...d.data(),_fid:d.id})); },
      async add(e) { const r=await addDoc(col(),{...e,createdAt:serverTimestamp()}); return r.id; },
      async update(fid,e) { await updateDoc(doc(db,"entries",fid),e); },
      async remove(fid) { await deleteDoc(doc(db,"entries",fid)); },
    };
    window._fbReady=true;
    window.dispatchEvent(new Event("fbready"));
  </script>
  <script type="text/babel">
    const {useState,useEffect,useRef,useCallback}=React;
    const C={soil:"#3B2F2F",moss:"#4A6741",sage:"#7A9E7E",straw:"#D4B896",parchment:"#F5EFE6",cream:"#FDFAF5",ink:"#2C2416",muted:"#9A8F82",border:"#E2D9CE",spring:"#7EC8A4",summer:"#E8A838",autumn:"#C1622F",winter:"#7AAEC8"};
    const SEASONS=["Spring","Summer","Autumn","Winter"];
    const TAGS=["Vegetables","Flowers","Herbs","Fruit","Trees & Shrubs","Soil & Compost","Pests","General"];
    const SC={Spring:C.spring,Summer:C.summer,Autumn:C.autumn,Winter:C.winter};
    function getSeason(d){const m=new Date(d).getMonth()+1;return m>=3&&m<=5?"Spring":m>=6&&m<=8?"Summer":m>=9&&m<=11?"Autumn":"Winter";}
    const Icon={
      plus:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      bell:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
      img:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
      x:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      edit:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
      trash:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>,
      search:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
      export:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
    };
    const emptyForm=()=>({_fid:null,id:null,date:new Date().toISOString().slice(0,10),title:"",notes:"",learnings:"",reminder:"",tags:[],photos:[]});
    function GardenJournal(){
      const [entries,setEntries]=useState([]);
      const [syncState,setSyncState]=useState("busy");
      const [view,setView]=useState("journal");
      const [showForm,setShowForm]=useState(false);
      const [form,setForm]=useState(emptyForm());
      const [filterSeason,setFilterSeason]=useState("All");
      const [filterTag,setFilterTag]=useState("All");
      const [search,setSearch]=useState("");
      const [expandedId,setExpandedId]=useState(null);
      const [lightboxSrc,setLightboxSrc]=useState(null);
      const fileRef=useRef();
      const load=useCallback(async()=>{setSyncState("busy");try{const r=await window._fb.load();setEntries(r);setSyncState("ok");}catch(e){console.error(e);setSyncState("err");}},[]);
      useEffect(()=>{if(window._fbReady)load();else window.addEventListener("fbready",load,{once:true});},[load]);
      const openNew=()=>{setForm(emptyForm());setShowForm(true);};
      const openEdit=(e)=>{setForm({...e,tags:[...e.tags],photos:[...e.photos]});setShowForm(true);};
      const handleSave=async()=>{
        if(!form.title.trim())return;
        setSyncState("busy");
        try{
          if(form._fid){const{_fid,...data}=form;await window._fb.update(_fid,data);setEntries(p=>p.map(e=>e._fid===_fid?{...form}:e));}
          else{const entry={...form,id:Date.now()};const fid=await window._fb.add(entry);setEntries(p=>[{...entry,_fid:fid},...p]);}
          setSyncState("ok");
        }catch(e){console.error(e);setSyncState("err");}
        setShowForm(false);
      };
      const handleDelete=async(entry)=>{
        if(!window.confirm("Delete this entry?"))return;
        setSyncState("busy");
        try{await window._fb.remove(entry._fid);setEntries(p=>p.filter(e=>e._fid!==entry._fid));setSyncState("ok");}
        catch(e){console.error(e);setSyncState("err");}
      };
      const handlePhoto=(e)=>{Array.from(e.target.files).forEach(f=>{const r=new FileReader();r.onload=ev=>setForm(fm=>({...fm,photos:[...fm.photos,{name:f.name,data:ev.target.result}]}));r.readAsDataURL(f);});e.target.value="";};
      const toggleTag=(tag)=>setForm(f=>({...f,tags:f.tags.includes(tag)?f.tags.filter(t=>t!==tag):[...f.tags,tag]}));
      const handleExport=()=>{const b=new Blob([JSON.stringify(entries,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="garden-journal-backup.json";a.click();URL.revokeObjectURL(u);};
      const filtered=entries.filter(e=>{
        if(filterSeason!=="All"&&getSeason(e.date)!==filterSeason)return false;
        if(filterTag!=="All"&&!e.tags.includes(filterTag))return false;
        if(search&&!`${e.title} ${e.notes} ${e.learnings}`.toLowerCase().includes(search.toLowerCase()))return false;
        return true;
      });
      const reminders=entries.filter(e=>e.reminder?.trim());
      const s={
        app:{fontFamily:"Georgia,serif",background:C.cream,minHeight:"100vh",color:C.ink},
        header:{background:C.soil,color:C.parchment,padding:"16px 16px 0",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 8px rgba(0,0,0,.3)"},
        headerTop:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10},
        logoText:{fontSize:19,fontWeight:"normal",color:C.parchment},
        logoSub:{fontSize:10,color:C.straw,display:"flex",alignItems:"center",marginTop:2},
        tabs:{display:"flex"},
        tab:(a)=>({padding:"8px 14px",cursor:"pointer",fontSize:12,border:"none",background:"none",color:a?C.cream:C.straw,borderBottom:a?`3px solid ${C.sage}`:"3px solid transparent",fontFamily:"Georgia,serif"}),
        addBtn:{background:C.moss,color:"#fff",border:"none",borderRadius:6,padding:"7px 13px",cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontSize:13,fontFamily:"Georgia,serif"},
        body:{maxWidth:700,margin:"0 auto",padding:"20px 12px"},
        toolbar:{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap",alignItems:"center"},
        select:{padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:6,background:"#fff",fontSize:12,color:C.ink,fontFamily:"inherit"},
        searchWrap:{position:"relative",flex:1,minWidth:140},
        searchIcon:{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",color:C.muted,pointerEvents:"none"},
        searchBox:{width:"100%",padding:"6px 8px 6px 26px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:12,fontFamily:"inherit",color:C.ink,background:"#fff"},
        exportBtn:{background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"6px 10px",cursor:"pointer",color:C.muted,display:"flex",alignItems:"center",gap:4,fontSize:12,fontFamily:"inherit"},
        card:(ss)=>({background:"#fff",borderRadius:10,marginBottom:12,borderLeft:`5px solid ${SC[ss]}`,boxShadow:"0 1px 4px rgba(0,0,0,.07)",overflow:"hidden"}),
        cardHead:{padding:"12px 14px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8},
        cardTitle:{fontSize:15,fontWeight:"normal",marginBottom:4,color:C.soil},
        cardMeta:{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"},
        dateBadge:(ss)=>({fontSize:11,color:SC[ss],fontFamily:"monospace"}),
        seasonPill:(ss)=>({fontSize:10,padding:"2px 6px",borderRadius:10,background:`${SC[ss]}22`,color:SC[ss],fontFamily:"sans-serif",textTransform:"uppercase"}),
        tagPill:{fontSize:10,padding:"2px 6px",borderRadius:10,background:`${C.moss}18`,color:C.moss,fontFamily:"sans-serif"},
        cardActions:{display:"flex",gap:4,flexShrink:0},
        iconBtn:(c)=>({background:"none",border:"none",cursor:"pointer",color:c||C.muted,padding:4,borderRadius:4,display:"flex",alignItems:"center"}),
        cardBody:{padding:"0 14px 14px",borderTop:`1px solid ${C.border}`},
        sectionLabel:{fontSize:10,letterSpacing:"0.1em",textTransform:"uppercase",color:C.muted,fontFamily:"sans-serif",marginTop:10,marginBottom:3},
        noteText:{fontSize:14,lineHeight:1.65,color:C.ink,whiteSpace:"pre-wrap"},
        learningBox:{background:`${C.sage}15`,borderRadius:6,padding:"8px 10px"},
        reminderBox:{background:`${C.straw}30`,borderRadius:6,padding:"8px 10px",display:"flex",gap:5,alignItems:"flex-start"},
        photoGrid:{display:"flex",flexWrap:"wrap",gap:6,marginTop:6},
        photo:{width:80,height:80,objectFit:"cover",borderRadius:6,cursor:"pointer"},
        empty:{textAlign:"center",padding:"50px 20px",color:C.muted},
        overlay:{position:"fixed",inset:0,background:"rgba(44,36,22,.5)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"},
        modal:{background:C.cream,borderRadius:"16px 16px 0 0",width:"100%",maxWidth:560,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 -4px 24px rgba(0,0,0,.2)"},
        modalHandle:{width:40,height:4,background:C.border,borderRadius:2,margin:"10px auto 0"},
        modalHead:{background:C.soil,color:C.parchment,padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"},
        modalTitle:{fontSize:15,fontWeight:"normal"},
        modalBody:{padding:16},
        field:{marginBottom:14},
        label:{display:"block",fontSize:10,letterSpacing:"0.1em",textTransform:"uppercase",color:C.muted,fontFamily:"sans-serif",marginBottom:4},
        input:{width:"100%",padding:"9px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:15,fontFamily:"inherit",color:C.ink,background:"#fff"},
        textarea:{width:"100%",padding:"9px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:15,fontFamily:"inherit",color:C.ink,background:"#fff",minHeight:80,resize:"vertical",lineHeight:1.6},
        tagGrid:{display:"flex",flexWrap:"wrap",gap:6},
        tagBtn:(a)=>({padding:"5px 10px",borderRadius:10,fontSize:12,cursor:"pointer",border:`1px solid ${a?C.moss:C.border}`,background:a?`${C.moss}20`:"#fff",color:a?C.moss:C.muted,fontFamily:"sans-serif"}),
        photoRow:{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginTop:6},
        thumbWrap:{position:"relative"},
        thumbImg:{width:60,height:60,objectFit:"cover",borderRadius:6,display:"block"},
        thumbDel:{position:"absolute",top:-5,right:-5,background:C.soil,color:"#fff",border:"none",borderRadius:"50%",width:18,height:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,fontSize:10},
        uploadBtn:{padding:"8px 12px",border:`1px dashed ${C.border}`,borderRadius:6,cursor:"pointer",fontSize:12,color:C.muted,background:"none",fontFamily:"sans-serif",display:"flex",alignItems:"center",gap:4},
        modalFooter:{display:"flex",justifyContent:"flex-end",gap:8,padding:"10px 16px 24px"},
        cancelBtn:{padding:"10px 18px",border:`1px solid ${C.border}`,borderRadius:6,cursor:"pointer",background:"none",fontSize:14,fontFamily:"inherit",color:C.muted},
        saveBtn:{padding:"10px 22px",background:C.moss,color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:14,fontFamily:"inherit"},
        remCard:{background:"#fff",borderRadius:10,padding:"12px 14px",marginBottom:10,borderLeft:`5px solid ${C.straw}`,boxShadow:"0 1px 4px rgba(0,0,0,.07)"},
        lightbox:{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"},
        lightboxImg:{maxWidth:"95vw",maxHeight:"90vh",borderRadius:8,objectFit:"contain"},
        lightboxClose:{position:"absolute",top:16,right:16,background:"rgba(255,255,255,.15)",border:"none",color:"#fff",borderRadius:"50%",width:36,height:36,cursor:"pointer",fontSize:18},
      };
      const syncLabel={busy:"Syncing…",ok:"Saved to cloud ☁️",err:"Sync error"};
      return (
        <div style={s.app}>
          <div style={s.header}>
            <div style={s.headerTop}>
              <div>
                <div style={s.logoText}>🌱 Garden Journal</div>
                <div style={s.logoSub}><span className={`sync-dot ${syncState}`}></span><span style={{fontSize:10,color:C.straw,fontFamily:"sans-serif"}}>{syncLabel[syncState]}</span></div>
              </div>
              <button style={s.addBtn} onClick={openNew}>{Icon.plus} New Entry</button>
            </div>
            <div style={s.tabs}>
              <button style={s.tab(view==="journal")} onClick={()=>setView("journal")}>Journal</button>
              <button style={s.tab(view==="reminders")} onClick={()=>setView("reminders")}>Next Year {reminders.length>0?`(${reminders.length})`:""}</button>
            </div>
          </div>
          <div style={s.body}>
            {view==="journal" && (<>
              <div style={s.toolbar}>
                <select style={s.select} value={filterSeason} onChange={e=>setFilterSeason(e.target.value)}><option value="All">All seasons</option>{SEASONS.map(s=><option key={s}>{s}</option>)}</select>
                <select style={s.select} value={filterTag} onChange={e=>setFilterTag(e.target.value)}><option value="All">All categories</option>{TAGS.map(t=><option key={t}>{t}</option>)}</select>
                <div style={s.searchWrap}><span style={s.searchIcon}>{Icon.search}</span><input style={s.searchBox} placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
                <button style={s.exportBtn} onClick={handleExport}>{Icon.export}</button>
              </div>
              {syncState==="busy"&&entries.length===0&&<div style={s.empty}><div style={{fontSize:32,marginBottom:10}}>☁️</div><div>Loading your journal…</div></div>}
              {syncState==="err"&&<div style={s.empty}><div style={{fontSize:32,marginBottom:10}}>⚠️</div><div style={{marginBottom:6}}>Couldn't reach Firebase</div><div style={{fontSize:12}}>Check your connection and refresh.</div></div>}
              {syncState==="ok"&&entries.length===0&&<div style={s.empty}><div style={{fontSize:36,marginBottom:10}}>🪴</div><div style={{fontSize:15,marginBottom:6}}>Your journal is empty</div><div style={{fontSize:13}}>Tap + New Entry to get started.</div></div>}
              {filtered.length===0&&syncState==="ok"&&entries.length>0&&<div style={s.empty}><div style={{fontSize:36,marginBottom:10}}>🔍</div><div>No entries match</div></div>}
              {filtered.map(entry=>{
                const season=getSeason(entry.date);const expanded=expandedId===entry._fid;
                return(<div key={entry._fid} style={s.card(season)}>
                  <div style={s.cardHead} onClick={()=>setExpandedId(expanded?null:entry._fid)}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={s.cardTitle}>{entry.title}</div>
                      <div style={s.cardMeta}>
                        <span style={s.dateBadge(season)}>{entry.date}</span>
                        <span style={s.seasonPill(season)}>{season}</span>
                        {entry.tags.map(t=><span key={t} style={s.tagPill}>{t}</span>)}
                        {entry.reminder&&<span style={{fontSize:11,color:C.straw,fontFamily:"sans-serif",display:"flex",alignItems:"center",gap:3}}>{Icon.bell}</span>}
                        {entry.photos?.length>0&&<span style={{fontSize:11,color:C.muted,fontFamily:"sans-serif",display:"flex",alignItems:"center",gap:2}}>{Icon.img} {entry.photos.length}</span>}
                      </div>
                    </div>
                    <div style={s.cardActions} onClick={e=>e.stopPropagation()}>
                      <button style={s.iconBtn(C.moss)} onClick={()=>openEdit(entry)}>{Icon.edit}</button>
                      <button style={s.iconBtn("#c0392b")} onClick={()=>handleDelete(entry)}>{Icon.trash}</button>
                    </div>
                  </div>
                  {expanded&&(<div style={s.cardBody}>
                    {entry.notes&&<><div style={s.sectionLabel}>Notes</div><div style={s.noteText}>{entry.notes}</div></>}
                    {entry.learnings&&<><div style={s.sectionLabel}>Learnings</div><div style={{...s.noteText,...s.learningBox}}>{entry.learnings}</div></>}
                    {entry.reminder&&<><div style={s.sectionLabel}>Next Year</div><div style={s.reminderBox}><span style={{color:C.straw}}>{Icon.bell}</span><span style={s.noteText}>{entry.reminder}</span></div></>}
                    {entry.photos?.length>0&&<><div style={s.sectionLabel}>Photos</div><div style={s.photoGrid}>{entry.photos.map((p,i)=><img key={i} src={p.data} alt={p.name} style={s.photo} onClick={()=>setLightboxSrc(p.data)}/>)}</div></>}
                  </div>)}
                </div>);
              })}
            </>)}
            {view==="reminders"&&(<>
              <p style={{fontSize:13,color:C.muted,fontFamily:"sans-serif",marginBottom:16}}>Everything flagged to remember for next season.</p>
              {reminders.length===0
                ?<div style={s.empty}><div style={{fontSize:36,marginBottom:10}}>📌</div><div style={{fontSize:15,marginBottom:6}}>No next-year notes yet</div><div style={{fontSize:13}}>Fill in "Note for Next Year" when adding an entry.</div></div>
                :reminders.map(entry=>{const season=getSeason(entry.date);return(<div key={entry._fid} style={s.remCard}>
                  <div style={{fontSize:14,marginBottom:3,color:C.soil}}>{entry.title}</div>
                  <div style={{fontSize:11,color:C.muted,fontFamily:"monospace",marginBottom:6}}>{entry.date} · {season}</div>
                  <div style={{fontSize:13,lineHeight:1.6,color:C.ink,display:"flex",gap:5}}><span style={{color:C.straw}}>{Icon.bell}</span><span>{entry.reminder}</span></div>
                </div>);})}
            </>)}
          </div>
          {showForm&&(
            <div style={s.overlay} onClick={e=>e.target===e.currentTarget&&setShowForm(false)}>
              <div style={s.modal}>
                <div style={s.modalHandle}></div>
                <div style={s.modalHead}><span style={s.modalTitle}>{form._fid?"Edit Entry":"New Entry"}</span><button style={s.iconBtn(C.straw)} onClick={()=>setShowForm(false)}>{Icon.x}</button></div>
                <div style={s.modalBody}>
                  <div style={s.field}><label style={s.label}>Date</label><input style={{...s.input,width:"auto"}} type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
                  <div style={s.field}><label style={s.label}>Title *</label><input style={s.input} placeholder="e.g. First tomatoes planted…" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/></div>
                  <div style={s.field}><label style={s.label}>Notes</label><textarea style={s.textarea} placeholder="What did you do? What did you observe?" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></div>
                  <div style={s.field}><label style={s.label}>Learnings</label><textarea style={{...s.textarea,minHeight:70}} placeholder="What worked, what didn't?" value={form.learnings} onChange={e=>setForm(f=>({...f,learnings:e.target.value}))}/></div>
                  <div style={s.field}><label style={s.label}>Note for Next Year 📌</label><textarea style={{...s.textarea,minHeight:60}} placeholder="A reminder to your future self…" value={form.reminder} onChange={e=>setForm(f=>({...f,reminder:e.target.value}))}/></div>
                  <div style={s.field}><label style={s.label}>Categories</label><div style={s.tagGrid}>{TAGS.map(t=><button key={t} style={s.tagBtn(form.tags.includes(t))} onClick={()=>toggleTag(t)}>{t}</button>)}</div></div>
                  <div style={s.field}><label style={s.label}>Photos</label>
                    <div style={s.photoRow}>
                      {form.photos.map((p,i)=>(<div key={i} style={s.thumbWrap}><img src={p.data} alt={p.name} style={s.thumbImg}/><button style={s.thumbDel} onClick={()=>setForm(f=>({...f,photos:f.photos.filter((_,j)=>j!==i)}))}>✕</button></div>))}
                      <button style={s.uploadBtn} onClick={()=>fileRef.current.click()}>{Icon.img} Add photo</button>
                      <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handlePhoto}/>
                    </div>
                  </div>
                </div>
                <div style={s.modalFooter}><button style={s.cancelBtn} onClick={()=>setShowForm(false)}>Cancel</button><button style={s.saveBtn} onClick={handleSave}>{form._fid?"Save changes":"Add to journal"}</button></div>
              </div>
            </div>
          )}
          {lightboxSrc&&(<div style={s.lightbox} onClick={()=>setLightboxSrc(null)}><img src={lightboxSrc} style={s.lightboxImg} alt="Full size"/><button style={s.lightboxClose} onClick={()=>setLightboxSrc(null)}>✕</button></div>)}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<GardenJournal />);
  </script>
  <script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
